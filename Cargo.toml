[package]
name = "envstack"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Layered configuration for Rust — environment variables, TOML files, CLI args with type-safe extraction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/envstack"
keywords = ["config", "configuration", "env", "toml", "layered"]
categories = ["config", "parser-implementations"]
exclude = ["/target"]

[features]
default = []
yaml = ["dep:serde_yaml"]
dotenv = ["dep:dotenvy"]
clap = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
serde_yaml = { version = "0.9", optional = true }
dotenvy = { version = "0.15", optional = true }
clap = { version = "4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
